[project]
name = "PasarGuard"
version = "5.2.1"
description = "Unified GUI Censorship Resistant Solution"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "Deprecated==1.2.13",
    "Jinja2>=3.1.6",
    "PyJWT>=2.10.1",
    "PyYAML>=6.0.2",
    "alembic>=1.19.1",
    "bcrypt==5.0.0",
    "click>=8.4.2",
    "commentjson==0.9.0",
    "cryptography==50.0.0",
    "fastapi>=0.141.1",
    "jdatetime>=6.1.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.8.2",
    "python-multipart>=0.0.32",
    "qrcode>=8.1",
    "rich>=15.0.0",
    "uvicorn==0.52.3",
    "sse-starlette>=3.4.8",
    "aiohttp>=3.14.3",
    "packaging>=26.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.31.0",
    "asyncmy>=0.2.14; sys_platform != 'win32'",
    "aiocache>=0.12.3",
    "aiogram>=3.30.0",
    "aiohttp-socks>=0.12.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "aiorwlock>=1.5.0",
    "typer>=0.27.1",
    "pasarguard-node-bridge>=0.9.0",
    "pip-system-certs>=5.3",
    "nats-py>=2.15.0",
]

[tool.ruff]
line-length = 120
indent-width = 4
respect-gitignore = true
exclude = ["app/db/migrations"]
fix = true

[tool.ruff.lint]
fixable = ["ALL"]
# Intentional resilience / no-op catch patterns across the codebase.
ignore = ["BLE001", "S110"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is the standard Depends()/factory pattern.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "app.routers.authentication.require_permission",
    "app.routers.authentication.require_scope_all",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pymysql>=1.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-watch>=4.2.0",
    "ruff>=0.16.4",
    "sqlalchemy-utils>=0.41.2",
    "watchfiles>=1.2.0",
]
