[project]
name = "PasarGuard"
version = "5.6.0"
description = "Unified GUI Censorship Resistant Solution"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "Deprecated==1.2.13",
    "Jinja2>=3.1.6",
    "PyJWT>=2.10.1",
    "PyYAML>=6.0.2",
    "alembic>=1.20.1",
    "bcrypt==5.0.0",
    "certifi>=2026.10.23",
    "click>=8.5.1",
    "commentjson==0.9.0",
    "cryptography==50.0.2",
    "fastapi>=0.162.2",
    "jdatetime>=6.1.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.2",
    "python-dateutil>=4.0.0",
    "python-multipart>=0.0.33",
    "qrcode>=8.1",
    "rich>=15.0.0",
    "uvicorn==0.54.0",
    "sse-starlette>=3.7.0",
    "aiohttp>=3.14.5",
    "packaging>=26.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.32.0",
    "asyncmy>=0.2.18; sys_platform != 'win32'",
    "aiocache>=0.12.3",
    "aiogram>=3.31.0",
    "aiohttp-socks>=0.12.0",
    "uvloop>=0.23.0; sys_platform != 'win32'",
    "aiorwlock>=1.5.0",
    "typer>=0.28.0",
    "pasarguard-node-bridge>=0.10.0",
    "nats-py>=2.16.0",
    "webauthn>=3.0.1",
]

[tool.ruff]
line-length = 120
indent-width = 4
respect-gitignore = true
exclude = ["app/db/migrations"]
fix = true

[tool.ruff.lint]
fixable = ["ALL"]
# Intentional resilience / no-op catch patterns across the codebase.
ignore = ["BLE001", "S110"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is the standard Depends()/factory pattern.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "app.routers.authentication.require_permission",
    "app.routers.authentication.require_scope_all",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pymysql>=1.2.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-watch>=4.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "sqlalchemy-utils>=0.43.0",
    "watchfiles>=1.3.0",
]
