# Legacy services only. New projects: .railway/railway.ts (see docs/RAILWAY-fa.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
drainingSeconds = 50
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
